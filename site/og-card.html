<!DOCTYPE html>
<!-- Source of og.png (1200 × 630), the preview image when a link to dettino.com is shared.
     Regenerate after editing:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --screenshot=site/og.png "file://$PWD/site/og-card.html"
     Not linked from the site; the noindex meta keeps it out of search. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Dettino share card</title>
<style>
@font-face { font-family: "Saira"; src: url("fonts/saira-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 50% 125%; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #2EC4A0; color: #0B0D0C;
  font-family: "Saira", ui-sans-serif, system-ui, sans-serif;
  display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
}
.lockup { display: flex; align-items: center; gap: 28px; font-weight: 700; font-stretch: 112%; font-size: 64px; letter-spacing: -.005em; }
.mark { width: 112px; height: 112px; }
.m-sq { fill: #0B0D0C; }
.m-d { fill: #2EC4A0; stroke: #2EC4A0; }
h1 { margin: 64px 0 0; font-weight: 800; font-stretch: 88%; font-size: 72px; line-height: 1.1; letter-spacing: -.015em; white-space: nowrap; }
kbd { font: inherit; background: #0B0D0C; color: #2EC4A0; border-radius: 12px; display: inline-block; line-height: 1; padding: .06em .14em .1em; margin: 0 .04em; }
p { margin: 36px 0 0; font-size: 34px; font-weight: 500; color: #163A30; }
</style>
</head>
<body>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true"><rect class="m-sq" x="64" y="64" width="896" height="896" rx="208"/><path class="m-d" d="M319 716L250 846L407 777Z" stroke-width="22" stroke-linejoin="round"/><circle class="m-d" cx="478" cy="582" r="208"/><rect class="m-d" x="606" y="182" width="160" height="612" rx="80"/><circle class="m-sq" cx="478" cy="582" r="88"/></svg>
    Dettino
  </div>
  <h1>Hold <kbd>Ctrl+Space</kbd>. Talk. It’s typed.</h1>
  <p>Private dictation for Windows and Mac. Free and open source.</p>
</body>
</html>
