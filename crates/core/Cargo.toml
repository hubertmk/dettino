[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full", "test-util"] }
