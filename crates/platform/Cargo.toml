[package]
name = "app-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core.workspace = true
app-hotkey.workspace = true
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Graphics_Dxgi", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.2"
libc = "0.2.189"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSColor", "NSColorSpace", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSSound", "NSWorkspace"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "AXError", "AXUIElement", "AXValue", "HIServices"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSError", "NSObject", "NSProcessInfo", "NSString", "NSURL", "NSUserDefaults"] }
