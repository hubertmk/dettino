[package]
name = "app-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-core.workspace = true
async-trait = "0.1.92"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "multipart", "charset", "system-proxy", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["full"] }
