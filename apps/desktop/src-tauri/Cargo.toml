[package]
name = "dettino"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hold a key, speak, release: cleaned-up text in any app. Local or cloud AI, your choice."

[lib]
name = "dettino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
chrono = "0.4.45"
app-core.workspace = true
app-hotkey.workspace = true
app-audio.workspace = true
app-platform.workspace = true
app-asr-cloud.workspace = true
app-asr-local.workspace = true
app-llm.workspace = true
app-cleanup.workspace = true
app-storage.workspace = true

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = "2.1.1"
